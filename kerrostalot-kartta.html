 @media(max-width:700px){#side{display:none}#map{left:0}}
</style></head><body>

pts.forEach(p=>{

map.fitBounds(group,{padding:[40,40]});

pts.forEach(p=>{

 li.innerHTML=`<span class="pin">${p.n}</span><span><span class="nm">${p.name}</span><br><span class="ad">${p.addr}</span></span>`;
 li.onclick=()=>{map.setView([p.lat,p.lng],17);markers[p.n].openPopup();};
 list.appendChild(li);
});
